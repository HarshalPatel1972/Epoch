name: Epoch v2

on:
  push:
    branches: [main, v2]
    paths: ["v2/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/v2.yml"]

permissions:
  contents: read

jobs:
  core:
    name: core (Go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "stable"]
        exclude:
          # Go 1.22's linker omits LC_UUID, which current macOS refuses to load.
          - os: macos-latest
            go: "1.22"
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: v2/go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Run the example
        run: go run ./examples/shop -days 60

  sqlite:
    name: sqlitestore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: v2/sqlitestore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: v2/sqlitestore/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: staticcheck
        working-directory: v2
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: staticcheck (sqlitestore)
        working-directory: v2/sqlitestore
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        working-directory: v2/sqlitestore
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
